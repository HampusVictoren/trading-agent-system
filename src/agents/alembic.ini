# Alembic owns the `agent` schema, the way EF Core owns `trading`. Neither service's
# migration tool can reach the other's schema, which is enforced by the database rather
# than by convention - see db/init/01-schema.sh.
#
# There is no sqlalchemy.url here on purpose. The URL carries the agent_svc password, so
# it comes from the environment through app.settings, exactly as it does for the service
# itself. env.py reads it.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# A date in the filename, so `ls versions/` reads in the order the migrations ran rather
# than in the order of their hashes.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
