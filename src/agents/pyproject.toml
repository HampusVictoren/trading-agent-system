[project]
name = "agents"
version = "0.1.0"
description = "FastAPI-tjänst som kör ett AG2-agentteam för aktieanalys"
readme = "README.md"
authors = [
    { name = "HampusVictoren", email = "hampus.victoren@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ag2[openai]>=1.0.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    # openai 3.x types its http_client against httpx2 (pydantic's successor to httpx), and
    # memory.py needs a client of its own to set trust_env=False. Declared directly rather
    # than relied on through openai, and capped so a new major is its own Dependabot PR.
    "httpx2>=2.13,<3",
    "openai>=3.16.1",
    "pgvector>=0.5.0",
    # Imported directly by app/domain/models.py and app/settings.py.
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
]


[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.16",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "sqlalchemy[asyncio]>=2.0",
    "testcontainers[postgres]>=4.9",
]

# app/ sits directly in the project root, not under src/.
# Without this the wheel builds empty and `app` is only importable
# because the working directory happens to be src/agents.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is the whole point in tests

[tool.mypy]
python_version = "3.12"
# Without the plugin mypy reads BaseSettings' required fields as required constructor
# arguments, even though the whole point is that the environment supplies them.
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.domain.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
