[project]
name = "agents"
version = "0.1.0"
description = "FastAPI-tjänst som kör ett AG2-agentteam för aktieanalys"
readme = "README.md"
authors = [
    { name = "HampusVictoren", email = "hampus.victoren@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ag2[openai]>=1.0.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    # Capped: fastmcp 3 -> 4 arrived inside an unrelated Dependabot PR because
    # this had no upper bound. A new major must be its own, visible update.
    "fastmcp>=4.0.5,<5",
    "httpx>=0.28.1",
    "openai>=3.16.1",
    "pgvector>=0.5.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
]


[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

# app/ sits directly in the project root, not under src/.
# Without this the wheel builds empty and `app` is only importable
# because the working directory happens to be src/agents.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is the whole point in tests

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.domain.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
