name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Nightly, which the roadmap asks for and the compose job below is the reason for: the
  # only check here that brings the whole system up, and the only one that would notice the
  # outside world rotting - a base image moving, a published port taken, yfinance changing
  # its mind - on a repository where nothing was pushed that day.
  schedule:
    - cron: "17 3 * * *"
  # By hand, on any branch: the compose job's bring-up only runs outside pull requests, so
  # without this a change to it is first exercised on master. `gh workflow run ci.yml --ref
  # <branch>` runs it - and everything else - before the merge rather than after.
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, not tags. A tag can be moved if an
# action's repository is compromised; a SHA cannot. Dependabot keeps them current.
#
# Runners are pinned to an Ubuntu release too, so that an OS upgrade is a change
# made on purpose rather than one that arrives when GitHub moves ubuntu-latest.
# 24.04 matches the WSL environment the code is developed in. Dependabot does not
# update runner labels, so the next upgrade is a manual edit.

jobs:
  engine:
    name: Engine (.NET)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TradingSystem.slnx

      - name: Build (warnings are errors)
        run: dotnet build TradingSystem.slnx --no-restore -warnaserror

      - name: Check formatting
        run: dotnet format TradingSystem.slnx --verify-no-changes --no-restore

      # The database tests start a Postgres container through Testcontainers. The runner
      # already has Docker, so this needs no setup step - only the image pull, once per run.
      - name: Test
        run: dotnet test --solution TradingSystem.slnx --no-build

  agents:
    name: Agents (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check app/ tests/ migrations/

      - name: Check formatting
        run: uv run ruff format --check app/ tests/ migrations/

      - name: Type-check
        run: uv run mypy app/ migrations/

      # Like the engine's, some of these start a Postgres container through
      # Testcontainers. The runner already has Docker, so no setup step is needed.
      - name: Test
        run: uv run pytest

      # Regression guard: app/ was once silently missing from the built wheel,
      # and the service only ran because the working directory hid it.
      - name: Wheel must contain the app package
        run: |
          uv build --wheel -o dist
          uv run python -c 'import glob,sys,zipfile; n=sum(1 for x in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist() if x.startswith("app/") and x.endswith(".py")); print(f"{n} python files under app/ in the wheel"); sys.exit(0 if n >= 10 else 1)'

  agents-image:
    name: Agents (image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Written before the build, not committed, and the reason is that it has to be there
      # for the last step to prove anything: the repository has no .env, so a build from a
      # clean checkout cannot demonstrate that one would be left out. The Dockerfile names
      # the files it copies rather than copying the directory, so this is a guard against a
      # later `COPY . .` rather than against today's code.
      #
      # Only when there is not one already. On a runner there never is; on a developer's
      # machine running these steps by hand there always is, and it holds their real
      # secrets. A step that overwrote it would be a worse bug than the one it guards.
      - name: Put a .env in the build context
        run: |
          test -f src/agents/.env || echo "TAS_MARKER=not-a-real-value" > src/agents/.env

      # Both targets, so the migration step cannot rot while the service keeps building.
      - name: Build the service image
        run: docker build --target service -t tas-agents:ci src/agents

      - name: Build the migrate image
        run: docker build --target migrate -t tas-agents-migrate:ci src/agents

      - name: The service does not run as root
        run: |
          uid=$(docker run --rm tas-agents:ci python -c "import os; print(os.getuid())")
          test "$uid" = "10001" || { echo "running as uid $uid"; exit 1; }

      # The regression this guards happened once: `app` was missing from the built wheel and
      # the service ran anyway, because the working directory it was started in happened to
      # contain the source. -w / removes that hiding place, and building the application
      # proves the package is whole rather than merely importable.
      - name: The application builds with no working directory
        run: |
          docker run --rm -w / tas-agents:ci python -c \
            "from app.main import create_app; paths = create_app().openapi()['paths']; print(len(paths), 'paths'); assert len(paths) >= 7"

      # team_version is a sha256 over the prompt files' *contents*, so a build that mangled
      # one - line endings are the realistic way - would not fail. It would quietly answer
      # as a different team, and split the measured population in two.
      - name: The image's prompts are the repository's
        run: |
          app_dir=$(docker run --rm -w / tas-agents:ci python -c "import app, pathlib; print(pathlib.Path(app.__file__).parent)")
          (cd src/agents/app && find teams -name '*.md' | sort | xargs sha256sum) > repo-prompts.txt
          docker run --rm -w "$app_dir" tas-agents:ci sh -c "find teams -name '*.md' | sort | xargs sha256sum" > image-prompts.txt
          diff repo-prompts.txt image-prompts.txt

      # No database needed: `heads` reads the versions directory. It proves alembic is
      # installed, that alembic.ini and migrations/ both reached the image, and that the
      # history has not forked - two heads means two migrations claiming the same parent,
      # which `upgrade head` refuses at the worst possible moment.
      - name: The migrate image has one migration head
        run: |
          heads=$(docker run --rm tas-agents-migrate:ci heads | grep -c "(head)")
          test "$heads" = "1" || { echo "$heads heads"; exit 1; }

      - name: The migrate image carries alembic and not the test tools
        run: |
          tools=$(docker run --rm --entrypoint sh tas-agents-migrate:ci -c "ls /srv/.venv/bin" | grep -E "^(alembic|pytest|mypy|ruff)$" | sort | tr "\n" " ")
          test "$tools" = "alembic " || { echo "found: $tools"; exit 1; }

      - name: No .env reached either image
        run: |
          for image in tas-agents:ci tas-agents-migrate:ci; do
            if docker run --rm --entrypoint sh "$image" -c "find / -name '.env' -not -path '/proc/*' 2>/dev/null" | grep -q .; then
              echo "$image carries a .env"
              exit 1
            fi
          done

  engine-image:
    name: Engine (image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Local-only configuration, written so the leak check below has something to catch: a
      # clean checkout holds none of it, so a build from one cannot show that it would be
      # left out. Only when absent - on a runner there is nothing, on a developer's machine
      # these hold real values, and a step that overwrote them would be worse than the bug.
      #
      # It is not hypothetical. The first build of this image published a gitignored
      # appsettings.Development.json, because .dockerignore knew about .env and not about it.
      - name: Put local-only configuration in the build context
        run: |
          test -f .env || echo "POSTGRES_PASSWORD=not-a-real-value" > .env
          test -f src/engine/appsettings.Development.json || echo "{}" > src/engine/appsettings.Development.json

      - name: Build the engine image
        run: docker build -f src/engine/Dockerfile --target service -t tas-engine:ci .

      - name: Build the migrate image
        run: docker build -f src/engine/Dockerfile --target migrate -t tas-engine-migrate:ci .

      - name: The engine does not run as root
        run: |
          uid=$(docker run --rm --entrypoint sh tas-engine:ci -c "id -u")
          test "$uid" = "1654" || { echo "running as uid $uid"; exit 1; }

      # Asks git itself, rather than a list somebody has to keep in step: is any published
      # file one the repository refuses to track? .gitignore and .dockerignore are two lists
      # of "this must not leave the machine", and nothing holds them together. This needs no
      # editing when a new local-only file is invented.
      - name: No file git refuses to track reached the image
        run: |
          leaked=0
          for f in $(docker run --rm --entrypoint sh tas-engine:ci -c "ls /app"); do
            if git check-ignore -q "src/engine/$f"; then echo "leaked: $f"; leaked=1; fi
          done
          test "$leaked" = "0"

      - name: The migration bundle runs
        run: docker run --rm tas-engine-migrate:ci --version

      # What the bundle is for, against the database the checked-in init script builds. The
      # engine's own suite already proves the migrations under engine_svc's grants; what this
      # adds is that the bundle applies them, is safe to run twice, and reverses - which the
      # roadmap asks for under maintenance, tested rather than assumed. The expected count is
      # read off the migration files, so a new migration needs no edit here.
      - name: The bundle applies the schema, twice, and reverses it
        run: |
          set -euo pipefail
          docker network create ci-migrate
          docker run -d --name ci-db --network ci-migrate \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=throwaway \
            -e POSTGRES_DB=tradingdb -e ENGINE_DB_PASSWORD=throwaway-engine \
            -e AGENT_DB_PASSWORD=throwaway-agent \
            -v "$PWD/db/init:/docker-entrypoint-initdb.d:ro" \
            pgvector/pgvector:0.8.6-pg16
          for _ in $(seq 1 90); do
            docker exec ci-db psql -U engine_svc -d tradingdb -c "select 1" >/dev/null 2>&1 && break
            sleep 1
          done
          cs="Host=ci-db;Port=5432;Database=tradingdb;Username=engine_svc;Password=throwaway-engine"
          bundle() { docker run --rm --network ci-migrate tas-engine-migrate:ci --connection "$cs" "$@"; }
          ask() { docker exec ci-db psql -U engine_svc -d tradingdb -tAc "$1" | tr -d " "; }

          expected=$(ls src/engine/Infrastructure/Persistence/Migrations/*.cs \
            | grep -v "\.Designer\.cs$" | grep -v "ModelSnapshot" | wc -l | tr -d " ")
          echo "$expected migrations on disk"

          bundle
          applied=$(ask "select count(*) from trading.__ef_migrations_history")
          test "$applied" = "$expected" || { echo "applied $applied of $expected"; exit 1; }

          # Idempotent, because a deploy that is retried must not be a deploy that fails.
          bundle | tee second.log
          grep -q "No migrations were applied" second.log

          # And reversible. `0` reverts every migration; the history table survives, empty.
          bundle 0
          test "$(ask "select count(*) from trading.__ef_migrations_history")" = "0"
          test "$(ask "select count(*) from information_schema.tables where table_schema = 'trading'")" = "1"

      - name: Tear down the migration database
        if: always()
        run: |
          docker rm -f ci-db || true
          docker network rm ci-migrate || true

  compose:
    name: Compose
    runs-on: ubuntu-24.04
    # Four image builds and a cold database take a few minutes; a stack that hangs waiting on
    # a healthcheck should not hold a runner for the default six hours.
    timeout-minutes: 30
    # A project and a container name of the job's own. The default project is the one a
    # developer's real stack runs under, and its volume holds real decisions - so these steps,
    # pasted into a terminal, must not be able to reach it. `down -v` below names the project
    # literally as well, because that is the one line where a missing variable would destroy
    # something.
    env:
      COMPOSE_PROJECT_NAME: tas-ci
      DB_CONTAINER: tas-ci-db
      AGENTS_PORT: "8000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Throwaway values for a stack that lives for one job, and only when there is not one
      # already - on a runner there never is, on a developer's machine this file holds their
      # real secrets, and a step that overwrote it would be worse than the bug it guards.
      - name: Write a throwaway .env
        run: |
          test -f .env || cat > .env <<'ENV'
          POSTGRES_PASSWORD=throwaway-superuser
          ENGINE_DB_PASSWORD=throwaway-engine
          AGENT_DB_PASSWORD=throwaway-agent
          AGENT_API_KEY=throwaway-api-key-for-one-ci-job
          OUTCOMES_HMAC_SECRET=throwaway-outcomes-hmac-for-one-ci-job
          ENV

      # Cheap, so it runs on every pull request: the file parses, every variable it requires
      # has a value, a plain `up` starts the engine, and the mode that engine resolves to when
      # nobody has chosen one is Shadow. The last two replaced stage 6's D2 assertion (the engine
      # behind a profile) when stage 7 lifted it: the engine may start by default only because
      # its default places nothing. The mode is resolved with TRADING_MODE removed from both the
      # environment and the .env compose reads, so it is the file's own default being checked
      # and not whatever a developer's .env happens to choose.
      # Spelled as `if` rather than `! ... | grep`, which is what D2's check once was and which
      # could never fail: bash -e ignores the status of a command negated with `!`, so the
      # line ran, reported, and was discarded. Each assertion here names what it found.
      - name: The compose file is valid, and a plain up starts the engine in Shadow
        run: |
          set -euo pipefail
          docker compose config --quiet
          default=$(docker compose config --services)
          if ! grep -qx engine <<<"$default"; then
            echo "a plain 'up' does not start the engine; it starts: $(tr '\n' ' ' <<<"$default")"
            exit 1
          fi
          unset_env="${RUNNER_TEMP:-/tmp}/without-trading-mode.env"
          # Every spelling compose's .env reader accepts: leading whitespace, an `export `
          # prefix with any spacing, and whitespace around the `=`.
          grep -Ev '^[[:space:]]*(export[[:space:]]+)?TRADING_MODE[[:space:]]*=' .env > "$unset_env" || true
          mode=$(env -u TRADING_MODE docker compose --env-file "$unset_env" config --format json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["engine"]["environment"].get("Trading__Mode", ""))')
          if [ "$mode" != "Shadow" ]; then
            echo "a plain 'up' runs the engine in '${mode}' when no mode is chosen, not Shadow"
            exit 1
          fi
          echo "a plain 'up' starts: $(tr '\n' ' ' <<<"$default")- the engine in $mode"

      # Every port compose publishes is on the host's loopback. Three services publish one -
      # the database, the agent service and the collector - and a bare "4318:4318" would put
      # the next one on the network without anything else looking different.
      - name: Every published port is loopback-only
        run: |
          set -euo pipefail
          docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          published = [(name, port) for name, service in services.items() for port in service.get("ports", [])]
          broad = [f"{name}: {port}" for name, port in published if port.get("host_ip") != "127.0.0.1"]
          print(f"{len(published)} published ports")
          sys.exit("published beyond loopback: " + "; ".join(broad) if broad else 0)
          '

      # Everything below is the stage's own success criterion, and it is slow: four images
      # and a database from nothing. On master, nightly and by hand (workflow_dispatch) rather
      # than on every pull request, where the two image jobs already prove what each half
      # builds into.
      # `docker compose up -d`, as a person types it, and then waiting by hand - because
      # `--wait` reports failure when a container exits, even with code 0, so a compose file
      # that provisions through short-lived containers cannot be waited on as a whole.
      # Naming only the long-running service would work and would also skip engine-migrate;
      # that would quietly stop testing half of what a plain `up` is supposed to provision.
      # Since stage 7 lifted D2 that `up` starts the engine too, in Shadow; the steps after the
      # agent service's check follow it.
      - name: The system comes up from nothing
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker compose up -d
          healthy() { docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -aq agents)"; }
          for _ in $(seq 1 60); do
            [ "$(healthy)" = "healthy" ] && break
            sleep 3
          done
          test "$(healthy)" = "healthy" || { echo "the agent service is $(healthy)"; exit 1; }

      - name: Both schemas are current, each applied by its own container
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for service in agent-migrate engine-migrate; do
            code=$(docker inspect -f "{{.State.ExitCode}}" "$(docker compose ps -aq $service)")
            test "$code" = "0" || { echo "$service exited $code"; exit 1; }
          done
          ask() { docker compose exec -T db psql -U postgres -d tradingdb -tAc "$1" | tr -d " "; }
          expected=$(ls src/engine/Infrastructure/Persistence/Migrations/*.cs \
            | grep -v "\.Designer\.cs$" | grep -v "ModelSnapshot" | wc -l | tr -d " ")
          test "$(ask "select count(*) from trading.__ef_migrations_history")" = "$expected"
          test "$(ask "select count(*) from agent.alembic_version")" = "1"
          echo "$expected engine migrations applied, alembic stamped"

      # No Ollama on a runner, and the agent service is healthy anyway. That is the PR 1
      # decision being load-bearing rather than tidy: the healthcheck asks /health, so a
      # missing LLM backend does not make the container unhealthy - and if it did, nothing
      # gated on this service could start here at all.
      - name: The agent service answers, and refuses an unauthenticated call
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base="http://127.0.0.1:${AGENTS_PORT}"
          test "$(curl -sS -o /dev/null -w "%{http_code}" "$base/health")" = "200"
          test "$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$base/v1/signals")" = "401"

      # The engine's first act is to read trading.__ef_migrations_history and refuse to start
      # if it is behind the build, and "Application started" is logged after that check passes.
      # So one line in this log is the whole chain: the bundle ran, the schema is current, and
      # the engine accepted it. It then fails every cycle for want of an LLM, which is not
      # what is being tested and is why it only has to still be running. No `up` of its own:
      # the plain `up` above started it, which is the point, and the mode it logs at startup
      # has to be Shadow - the runtime half of the static check at the top of this job.
      # The log is captured before it is searched: `logs | grep -q` under pipefail fails when
      # grep finds the line, exits, and leaves `logs` writing into a closed pipe - a match
      # reported as a miss, more likely the longer the log.
      - name: The plain up started the engine, in Shadow, and its schema check passes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          started() { local log; log=$(docker compose logs engine 2>&1); grep -q "Application started" <<<"$log"; }
          for _ in $(seq 1 30); do
            started && break
            sleep 2
          done
          started || { echo "the engine never logged 'Application started'"; exit 1; }
          test "$(docker inspect -f "{{.State.Status}}" "$(docker compose ps -aq engine)")" = "running"
          log=$(docker compose logs engine 2>&1)
          if ! grep -q "Trading mode is Shadow" <<<"$log"; then
            echo "the engine did not start in Shadow:"
            grep "Trading mode is" <<<"$log" || echo "(no 'Trading mode is' line)"
            exit 1
          fi

      # The image's HEALTHCHECK reads the heartbeat the trading loop writes, and this is the check
      # that it does: healthy with no LLM on the runner, so every cycle's analyses fail, because
      # healthy means the loop is making progress rather than that its answers are good. The check
      # runs every 30 s and the first pass ends the start period, so a minute or so is normal; three
      # is the ceiling. "unhealthy" fails at once rather than waiting.
      - name: The engine's heartbeat makes it healthy
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          health() { docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -aq engine)"; }
          for _ in $(seq 1 90); do
            case "$(health)" in
              healthy) break ;;
              unhealthy) echo "the engine is unhealthy"; break ;;
            esac
            sleep 2
          done
          test "$(health)" = "healthy" || { echo "the engine is $(health)"; exit 1; }
          deadline=$(docker compose exec -T engine cat /tmp/engine.heartbeat)
          test "$deadline" -gt "$(date +%s)"
          echo "healthy, with a heartbeat good for $(( deadline - $(date +%s) )) s"

      # Stage 7's own criterion: an analysis cycle is one trace from the engine through the
      # agent chain. Both services export to the collector compose runs, which prints every
      # span; otel/check_one_trace.py reads that and looks for an agent-service server span
      # whose ancestry, parent by parent, runs through the engine's spans to the root of its
      # cycle, trading.cycle - one trace id across two processes. With no LLM on the runner
      # every analysis fails at the model call, which is fine: the request, its agent and its
      # failed model call are still the agents' work, inside the engine's trace. The root
      # arrives when the cycle ends, which without an LLM is seconds after the first analysis.
      - name: One engine cycle and the agents' work are one trace
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            log=$(docker compose logs --no-log-prefix otel-collector 2>&1)
            rc=0
            python3 otel/check_one_trace.py <<<"$log" > one-trace.txt || rc=$?
            if [ "$rc" -eq 0 ]; then
              cat one-trace.txt
              exit 0
            fi
            # 2: spans from a service other than the engine and the agents; waiting won't help.
            if [ "$rc" -eq 2 ]; then
              cat one-trace.txt
              exit 1
            fi
            sleep 5
          done
          cat one-trace.txt
          echo "no trace reached from the engine's cycle into the agent service in five minutes"
          exit 1

      # One engine per database, end to end, and Hampus's decision that a refused engine stays
      # stopped (2026-10-10). A second replica of the engine service - the stack's own image,
      # configuration, database and restart policy, which is what a host-run engine beside a
      # plain `up` amounts to - must log the refusal, exit 0, and not be restarted; then, with
      # the first engine stopped, it must still not come back and take over. The refusal is read
      # from the log line, because exit 0 is what keeps `restart: on-failure` from retrying it.
      # The first engine has to be running before and is stopped by this step, so it goes last.
      - name: A second engine refuses to start, and stays stopped when the first one stops
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          first=$(docker compose ps -q engine)
          test "$(docker inspect -f "{{.State.Status}}" "$first")" = "running"
          docker compose up -d --no-deps --no-recreate --scale engine=2 engine
          second=$(docker compose ps -aq engine | grep -v "^${first:0:12}" | head -n 1 || true)
          test -n "$second" || { echo "no second engine container was created"; exit 1; }
          status() { docker inspect -f "{{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$second"; }
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f "{{.State.Status}}" "$second")" = "exited" ] && break
            sleep 2
          done
          log=$(docker logs "$second" 2>&1)
          tail -n 3 <<<"$log"
          if ! grep -q "Another engine is already running against this database" <<<"$log"; then
            echo "the second engine did not log the refusal ($(status))"
            exit 1
          fi
          if grep -q "Trading mode is" <<<"$log"; then
            echo "the second engine got as far as its trading worker before refusing"
            exit 1
          fi
          if [ "$(status)" != "exited exit=0 restarts=0" ]; then
            echo "the refused engine is not stopped for good: $(status)"
            exit 1
          fi
          test "$(docker inspect -f "{{.State.Status}}" "$first")" = "running"
          docker stop "$first" >/dev/null
          sleep 20
          if [ "$(status)" != "exited exit=0 restarts=0" ]; then
            echo "the refused engine came back after the first one stopped: $(status)"
            exit 1
          fi
          echo "refused, exit 0, not restarted - and still stopped 20 s after the first engine stopped"

      - name: What the system said, for whoever reads a failed run
        if: always() && github.event_name != 'pull_request'
        run: docker compose logs --tail 40 || true

      - name: Tear the system down, volume included
        if: always() && github.event_name != 'pull_request'
        run: docker compose -p tas-ci down -v || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # Pinned here rather than downloaded next to the binary: a checksum file
      # from the same release cannot vouch for that release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check -
          tar -xzf gitleaks.tgz gitleaks

      # Blocking: a leaked secret always stops the build.
      - name: Scan for secrets
        run: ./gitleaks git . --redact --no-banner

  vulnerabilities:
    name: Vulnerability scan (advisory)
    runs-on: ubuntu-24.04
    # Advisory by design: a new CVE in an untouched transitive dependency should
    # not block unrelated work. Dependabot opens the fix as its own PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # No cache here. By default this job would save to the same key as the
      # agents job, and whichever job saves first decides what the agents job
      # restores until uv.lock changes. This job only needs pip-audit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: .NET packages
        run: dotnet list TradingSystem.slnx package --vulnerable --include-transitive

      - name: Python packages
        working-directory: src/agents
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project --quiet > requirements.lock
          uvx pip-audit --requirement requirements.lock --disable-pip --progress-spinner off
