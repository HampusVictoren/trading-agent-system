# The whole system, on one host. Compose owns every container here - trading-db included, and
# it is still never created by hand.
#
#   docker compose up -d     # database, both schemas, agent service, collector - and the engine
#
# **The engine starts with a plain `up`, in Shadow unless TRADING_MODE says otherwise**: it
# analyses, sizes, risk-gates and records every decision and places nothing - not even the
# stop-loss and time-limit sales on positions the account already holds. An account with real
# paper positions needs TRADING_MODE=Paper in the root .env, or nothing closes them (the engine
# says so at startup, with a warning naming the holdings).
#
# Until stage 7 the engine sat behind a `trade` profile (stage 6's D2): it is the one service
# that spends money, and "not starting it" was then the only way to stop it. Stage 7 added the
# other ways - Shadow as the default, which places nothing, and trading.kill_switch, which stops
# a running engine's buying - so D2 is lifted and the profile is gone (Hampus, 2026-10-09).
#
# **One engine per database, enforced.** The engine takes a Postgres advisory lock at startup and
# holds it for as long as it runs; a second engine against the same database - the container
# beside one on the host (`dotnet run --project src/engine`), or the reverse - refuses to start,
# naming the holder, and exits 3. Note what `restart: on-failure` below then does with a refused
# container: it retries, with Docker's backoff, and **takes over when the other engine stops** -
# in the mode .env gives it. To run the engine on the host, `docker compose stop engine` first;
# a stopped container is not restarted until the next `up`.
#
# Secrets come from .env in the repository root; see .env.example. **Compose reads that file
# itself**, for the ${...} below - it is never handed to a container. What each service gets
# is the explicit list under its own `environment:`, and that is what keeps the agent service
# from ever seeing the superuser's or the engine's password. The separation is enforced here
# rather than by two files, now that one file feeds both services.

services:
  db:
    # Pinned rather than the floating :pg16 tag, so every machine and every
    # rebuild gets the same Postgres and pgvector.
    image: pgvector/pgvector:0.8.6-pg16
    # A fixed name, because half the documentation says `docker exec -it trading-db psql`.
    # A variable, because a fixed name is also what stops a second stack existing - and the
    # second stack is how this file is tested against a clean volume.
    container_name: ${DB_CONTAINER:-trading-db}
    environment:
      POSTGRES_DB: tradingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read once by db/init/01-schema.sh to create the per-service login roles.
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?set ENGINE_DB_PASSWORD in .env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in .env}
    ports:
      # Loopback only. A bare "5432:5432" publishes the database to the network. The port is a
      # variable so a second stack can run beside the first, which is how this file is tested
      # against a clean volume without touching the one holding real decisions.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - trading-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradingdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The two schemas, each applied by its owner's own tool in a container of its own. They run
  # to completion and stop; the services that need them wait on that rather than on a port.
  # Neither service can migrate its own schema from inside itself, which is the invariant
  # these two containers exist to keep true rather than merely intended.
  agent-migrate:
    build:
      context: ./src/agents
      target: migrate
    image: tas-agents-migrate:local
    depends_on:
      db:
        condition: service_healthy
    # `alembic` is the image's entrypoint, so this is its arguments. The DSN travels as
    # `-x url=` because env.py's other route is get_settings(), which requires every setting
    # the service needs - this container would otherwise need an LLM API key to create a table.
    command:
      - "-x"
      - "url=postgresql://agent_svc:${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in .env}@db:5432/tradingdb"
      - "upgrade"
      - "head"
    restart: "no"

  engine-migrate:
    build:
      context: .
      dockerfile: src/engine/Dockerfile
      target: migrate
    image: tas-engine-migrate:local
    depends_on:
      db:
        condition: service_healthy
    # Not --connection, although the bundle takes it: the environment keeps the password out
    # of the container's rendered command. ENGINE_DATABASE_URL is what the design-time factory
    # reads, and the bundle invokes that factory at run time. Without either, it fails to
    # resolve `design.invalid` instead of migrating something nobody meant to.
    environment:
      ENGINE_DATABASE_URL: Host=db;Port=5432;Database=tradingdb;Username=engine_svc;Password=${ENGINE_DB_PASSWORD:?set ENGINE_DB_PASSWORD in .env}
    restart: "no"

  agents:
    build:
      context: ./src/agents
      target: service
    image: tas-agents:local
    depends_on:
      db:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
    environment:
      # agent_svc, and only agent_svc. The other two passwords are interpolated by compose
      # above and never appear in this list, which is the whole point of listing rather than
      # passing a file.
      TAS_DATABASE_URL: postgresql://agent_svc:${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in .env}@db:5432/tradingdb
      TAS_AGENT_API_KEY: ${AGENT_API_KEY:?set AGENT_API_KEY in .env - the same value the engine gets}
      TAS_OUTCOMES_HMAC_SECRET: ${OUTCOMES_HMAC_SECRET:?set OUTCOMES_HMAC_SECRET in .env - the same value the engine gets}

      # Ollama runs on the host, and a container's 127.0.0.1 is the container. host-gateway
      # below reaches the host's network namespace, which WSL's mirrored networking has
      # already put on Windows - so the two mechanisms compose and no host IP is needed.
      TAS_EMBEDDINGS_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      TAS_EMBEDDINGS_API_KEY: ${OLLAMA_API_KEY:-ollama-needs-no-key}
      TAS_LLM__DEFAULT__BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      TAS_LLM__DEFAULT__API_KEY: ${OLLAMA_API_KEY:-ollama-needs-no-key}

      # **These four are part of team_version.** The hash covers each role's resolved model,
      # so a model, temperature or seed that differs from src/agents/.env would make the same
      # team answer under a different version - and two populations that cannot be pooled
      # would start accumulating under one name. They are spelled out here rather than read
      # from that file because a clean checkout does not have it, and `up` has to work from
      # one. Change them in both places or in neither.
      TAS_LLM__DEFAULT__PROVIDER: openai_compatible
      TAS_LLM__DEFAULT__MODEL: ${LLM_MODEL:-qwen2.5:14b}
      TAS_LLM__DEFAULT__TEMPERATURE: "0.0"
      TAS_LLM__DEFAULT__SEED: "42"

      # One LLM call, one quote, and one whole universe. The engine's own request timeout is
      # 120 s, so it gives up on a pathological chain before this service's ceiling of 3x60.
      TAS_LLM__DEFAULT__TIMEOUT_S: "60"
      TAS_MARKET_DATA_TIMEOUT_S: "30"
      TAS_MARKET_DATA_TTL_S: "300"
      TAS_SCREEN_TIMEOUT_S: "120"
      TAS_SCREEN_TTL_S: "3600"

      # Not TAS_BIND_HOST: the image sets 0.0.0.0, because a container's loopback reaches only
      # the container. Overriding it here would bind a socket the published port cannot find.
      TAS_ENVIRONMENT: ${TAS_ENVIRONMENT:-development}

      # Traces, to the collector below, over OTLP/HTTP - the standard variables rather than
      # TAS_ ones, because they are what every OpenTelemetry SDK reads and the engine gets the
      # same values. `-` rather than `:-`, so OTEL_EXPORTER_OTLP_ENDPOINT= (set and empty) in
      # the root .env turns export off instead of falling back to the collector; so does
      # OTEL_SDK_DISABLED=true. No prompt, answer or fact sheet is ever on a span - see
      # src/agents/app/observability/tracing.py. Logs are not exported; they stay on stdout.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only, like the database. Published at all so that a host-run engine can use
      # the containerised agent service - which also means this collides with `uv run python
      # -m app` on the same port, and the collision is a clear error rather than a surprise.
      - "127.0.0.1:${AGENTS_PORT:-8000}:8000"
    restart: unless-stopped

  # Receives the engine's metrics and traces and the agent service's traces, and prints them:
  # there is no backend yet, so `docker compose logs otel-collector` is where a trace is read.
  # See otel/collector.yaml. Nothing depends on it - telemetry is not a reason for a service
  # not to start - and it has no healthcheck, because the image is distroless and has no shell
  # to run one in.
  otel-collector:
    # A version and the digest of that version's multi-arch index, so a re-pushed tag cannot
    # change what runs. The core distribution rather than contrib: it has the OTLP receiver,
    # the batch processor and the debug exporter, which is all this uses.
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Loopback only, like everything else here, so a host-run engine or agent service can
      # export to it (OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318, and for the engine
      # OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf). OTLP/HTTP only; gRPC is not opened.
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    # The debug exporter writes every span and every metric export to stdout, at the detailed
    # verbosity the trace check needs (it reads parent ids), and the service restarts unless
    # stopped - so without a cap its log would grow for as long as the stack runs. Three files of
    # 10 MB keep hours of a running engine's telemetry, which is what reading a recent trace
    # needs; anything older belongs in a backend, which this is not.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  engine:
    # Started by a plain `up` since stage 7 (D2 lifted); see the note at the top of this file.
    build:
      context: .
      dockerfile: src/engine/Dockerfile
      target: service
    image: tas-engine:local
    depends_on:
      db:
        condition: service_healthy
      engine-migrate:
        condition: service_completed_successfully
      agents:
        condition: service_healthy
    environment:
      # The three secrets appsettings.json deliberately does not hold. Double underscore is
      # how .NET configuration reads a nested key out of the environment, so
      # Database__ConnectionString is Database:ConnectionString.
      Database__ConnectionString: Host=db;Port=5432;Database=tradingdb;Username=engine_svc;Password=${ENGINE_DB_PASSWORD:?set ENGINE_DB_PASSWORD in .env}
      AgentService__ApiKey: ${AGENT_API_KEY:?set AGENT_API_KEY in .env - the same value the agent service gets}
      AgentService__OutcomesHmacSecret: ${OUTCOMES_HMAC_SECRET:?set OUTCOMES_HMAC_SECRET in .env - the same value the agent service gets}
      # Overrides appsettings.json's 127.0.0.1, which is right for a host-run engine and
      # reaches nothing from inside a container.
      AgentService__BaseUrl: http://agents:8000
      # Shadow unless the root .env says otherwise - the same default appsettings.json ships,
      # spelled out here so that the mode a container runs in is readable in this file, and CI's
      # compose job asserts that a plain `up` resolves to it. Paper executes against the simulated
      # portfolio and is what manages held positions; Live is refused at startup (no broker).
      Trading__Mode: ${TRADING_MODE:-Shadow}
      # Where the engine's metrics and traces go: the collector below, over OTLP/HTTP like the
      # agent service's, so one collector port takes both and the engine's cycle trace and the
      # agents' spans meet there. As for the agent service, OTEL_EXPORTER_OTLP_ENDPOINT= (set and
      # empty) in the root .env turns export off - the engine then registers no exporter at all
      # - and so does OTEL_SDK_DISABLED=true. Not a dependency: a collector that is down costs
      # telemetry, never a cycle.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    # The healthcheck is the image's own (src/engine/Dockerfile): the trading loop writes a
    # deadline to /tmp/engine.heartbeat at every step of a cycle and after every quote, and the
    # check is healthy while that deadline is in the future. It is not repeated here, so `docker
    # run` and compose cannot disagree about it. Nothing depends on the engine's health - it is
    # the last link in the chain - so it is a signal for whoever runs `docker compose ps`, and for
    # the compose job in CI, rather than a gate.
    # Docker's default is 10 s between SIGTERM and SIGKILL. The engine's host gives its workers
    # up to 30 s (.NET's default shutdown timeout) to finish the unit of work in hand, and after
    # that the trace and metric exporters each get up to 3 s to flush - 36 s at worst, with a
    # collector configured and gone. 45 s covers that with room, so a stop is a clean shutdown
    # and not a kill halfway through one. With no endpoint set there is nothing to flush, and a
    # stop takes as long as the worker's current step takes to notice the cancellation.
    stop_grace_period: 45s
    # on-failure rather than unless-stopped: the engine's own loop already survives a failed
    # cycle, so a process that exits has hit something structural - a configuration it refuses,
    # a schema behind the build, another engine holding the lock (exit 3) or the lock lost
    # mid-run (exit 4). Restarting is a bet that an operator is fixing it, and Docker's backoff
    # keeps the bet cheap; a clean exit stays exited. After exit 4 the restart goes back through
    # the lock, so it either holds it again or is refused.
    restart: on-failure

volumes:
  trading-db-data:
